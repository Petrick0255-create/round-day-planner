<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f7f2e9"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="동그란 하루"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="app-icon.svg" type="image/svg+xml"><link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180"><link rel="preconnect" href="https://www.gstatic.com" crossorigin><link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin><title>동그란 하루</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="overrides.css"></head><body>
<div id="app">
  <header><div><span class="eyebrow">MY WEEK, MY RHYTHM</span><h1 id="pageTitle">동그란 하루</h1></div><div class="account-area"><button id="todayChip" class="date-chip"></button><button id="authButton" class="auth-button">Google 로그인</button></div></header>
  <main>
    <section id="today" class="view active">
      <div class="day-switch"><button id="prevDay" aria-label="이전 날">‹</button><div><strong id="todayName"></strong><span id="planName"></span></div><button id="nextDay" aria-label="다음 날">›</button></div>
      <div class="clock-wrap"><canvas id="clock" width="720" height="720"></canvas><div id="dragHint" class="drag-hint"></div><button id="clockCenter"><span id="centerDate"></span><b id="centerProgress"></b><small>오늘의 계획</small></button></div>
      <div id="selectedCard" class="selected-card"></div>
      <div class="legend"><span><i class="dot sleep"></i>꿈나라</span><span><i class="dot routine"></i>일상</span><span><i class="dot focus"></i>집중</span><span><i class="dot life"></i>약속·운동</span></div>
    </section>

    <section id="build" class="view">
      <div class="hero-card"><span class="stamp">WEEKLY PLANNER</span><h2>이번 주는<br>어떻게 보낼까요?</h2><p>잠드는 시간부터 하나씩 물어볼게요.<br>빈 시간 없이 동그란 하루를 완성해 보세요.</p><button class="primary" id="newPlan">＋ 계획 만들기</button></div>
      <h3 class="section-title">최근 계획</h3><div id="recentPlans" class="plan-list"></div>
    </section>

    <section id="library" class="view"><div class="library-head"><div><span class="eyebrow">MY TIMETABLES</span><h2>나의 시간표</h2></div><button class="round-add" id="libraryAdd">＋</button></div><p class="subcopy">이번 주에 사용할 시간표를 선택하세요.</p><div id="planLibrary" class="library-list"></div></section>
  </main>
  <nav><button data-tab="build"><span>✦</span>계획 세우기</button><button data-tab="today" class="active"><span>◉</span>오늘의 계획</button><button data-tab="library"><span>▤</span>나의 시간표</button></nav>
</div>

<dialog id="wizard"><form method="dialog"><div class="modal-head"><button value="cancel" class="icon-btn">×</button><div class="steps"><i class="on"></i><i></i><i></i></div><span></span></div><div id="wizardBody"></div></form></dialog>
<dialog id="detail"><form method="dialog"><div class="modal-head"><button value="cancel" class="icon-btn">×</button><b>일정 자세히</b><button id="deleteItem" class="text-danger" type="button">삭제</button></div><div id="detailBody"></div></form></dialog>
<div id="toast"></div>
<script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script defer src="app.js"></script></body></html>
